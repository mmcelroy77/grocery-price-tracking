[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-price-tracking"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyspark==4.1.0"]

[project.scripts]
gpt-sample = "grocery_price_tracking.jobs.sample_job:main"

# uv installs the "dev" group by default on `uv sync`
[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
