[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-price-tracking"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyspark==4.1.0"]

[project.scripts]
gpt-sample = "grocery_price_tracking.jobs.sample_job:main"

# uv installs the "dev" group by default on `uv sync`
[dependency-groups]
dev = ["pytest>=8", "coverage", "pytest-cov", "pre-commit>=4", "ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grocery_price_tracking = ["resources/*.properties"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = ["__pycache__", ".venv", "*.pyc", "*.pyo", "dist/", "build/", "*.egg-info/"]

[tool.coverage.report]
# Hide files with no statements (empty __init__.py) from the report.
skip_empty = true
