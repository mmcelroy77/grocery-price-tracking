name: Release

# Manual for now: run it from the Actions tab. The job runs in the "production" environment, so required
# reviewers must approve each run, and only then are that environment's AWS secrets released to it.
# By default it only plans; tick "apply" to deploy. Applying also builds the job image from the Dockerfile
# and pushes it to ECR tagged with the commit SHA; the plan points the task definition at that tag.
# One-time setup: see infra/README.md.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (leave off to only plan)"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once, and never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-2

defaults:
  run:
    working-directory: infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Terraform reads this as var.image_tag: the task definition runs the image pushed below.
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # No wrapper, so `terraform output -raw` below returns just the value.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # Local act runs (scripts/act/run_release.sh) have no AWS secrets, so the AWS-dependent
      # steps are skipped there and only fmt/init/validate run.
      - uses: aws-actions/configure-aws-credentials@v6
        if: env.ACT != 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Under act there is no AWS access, so init skips the S3 backend (ACT is set by act).
      - name: Init
        run: terraform init ${ACT:+-backend=false}

      - name: Validate
        run: terraform validate

      # The job summary (see scripts/ci/release_summary.py) shows the commit, a table of the changes and,
      # after an apply, the image and what is live.
      - name: Plan
        if: env.ACT != 'true'
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt
          python3 "$GITHUB_WORKSPACE/scripts/ci/release_summary.py" plan tfplan.json tfplan.txt

      # The image goes up before the apply, so the task definition never points at a missing tag.
      # Needs the ECR repository to exist already: on a brand-new account, apply once locally first
      # (see infra/README.md). Skipped under act, whose runner container has no Docker daemon.
      # The login action also logs Docker out again when the job ends.
      - name: Log in to ECR
        if: inputs.apply && env.ACT != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the job image
        if: inputs.apply && env.ACT != 'true'
        working-directory: .
        run: |
          repo="$(terraform -chdir=infra output -raw ecr_repository_url)"
          docker build -t "$repo:$GITHUB_SHA" .
          docker push "$repo:$GITHUB_SHA"
          # The summary is only a report: it must never stop the deploy after the push, so a missing
          # digest or a failing script is a warning, not an error.
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$GITHUB_SHA" 2>/dev/null || true)"
          python3 scripts/ci/release_summary.py image "$repo" "$GITHUB_SHA" "$digest" ||
            echo "::warning::Could not write the image summary"

      - name: Apply
        if: inputs.apply && env.ACT != 'true'
        run: terraform apply tfplan

      # Only a report: if it fails, the apply above still succeeded, so the run must not turn red.
      - name: Summarize the deployment
        if: inputs.apply && env.ACT != 'true'
        continue-on-error: true
        working-directory: .
        run: python3 scripts/ci/release_summary.py deployed infra/tfplan.json
