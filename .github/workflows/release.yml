name: Release

# Manual for now: run it from the Actions tab. Credentials come from GitHub OIDC (no stored keys).
# The job runs in the "production" environment, so required reviewers must approve each run.
# By default it only plans; tick "apply" to deploy. One-time setup: see infra/README.md.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (leave off to only plan)"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once, and never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-2

defaults:
  run:
    working-directory: infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Format check
        run: terraform fmt -check -recursive

      # Local act runs (scripts/act/run_release.sh) have no OIDC token or AWS access, so the
      # AWS-dependent steps are skipped there and only fmt/init/validate run.
      - uses: aws-actions/configure-aws-credentials@v6
        if: env.ACT != 'true'
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Under act there is no AWS access, so init skips the S3 backend (ACT is set by act).
      - name: Init
        run: terraform init ${ACT:+-backend=false}

      - name: Validate
        run: terraform validate

      - name: Plan
        if: env.ACT != 'true'
        run: |
          terraform plan -out=tfplan
          {
            echo "## Terraform plan"
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.apply && env.ACT != 'true'
        run: terraform apply tfplan
