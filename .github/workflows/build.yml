name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uvx ruff@0.17.4 check .
          uvx ruff@0.17.4 format --check .

      - name: Test with coverage
        run: uv run pytest -q --cov=grocery_price_tracking --cov-report=term-missing --cov-fail-under=62
