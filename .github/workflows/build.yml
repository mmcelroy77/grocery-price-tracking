name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test with coverage
        run: |
          mkdir -p reports
          uv run pytest -q \
            --junitxml=reports/junit.xml \
            --cov=grocery_price_tracking \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=62

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Test and coverage"
            echo '```'
            uv run coverage report
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Local artifact warning
        if: always() && env.ACT == 'true'
        run: |
          echo "::warning::Local act run: uploading with upload-artifact@v4 because act doesn't support v7; GitHub uses upload-artifact@v7."
          echo "> Local act run: uploaded with upload-artifact@v4 (act can't run v7); GitHub uses v7." \
            >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload reports (local)
        if: always() && env.ACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          path: reports/

      - name: Upload reports
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-reports
          path: reports/
