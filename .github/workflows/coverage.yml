name: Coverage Report

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage pytest-cov pyspark

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --show-missing --fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: python-unit-tests
          fail_github_action_failure: true

      - name: Generate HTML coverage report
        if: always()
        run: |
          python -m coverage html
          echo "HTML report generated in htmlcov/"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = require('@actions/core').getInput('coverage') || 'false';
            // Coverage comment is generated by Codecov action above
            core.setOutput('coverage-reported', coverage);