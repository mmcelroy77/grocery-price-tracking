repos:
  # Ruff runs through uv so its version comes from pyproject.toml + uv.lock,
  # the same source CI uses (no separate `rev` to keep in sync).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]

  # Ruff's EXE rules are not enforced on WSL/Windows, so this hook covers the
  # same ground (executable files must have a shebang) on every platform.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint